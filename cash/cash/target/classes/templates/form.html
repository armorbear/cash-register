<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${cash.id == null ? 'Add Item' : 'Edit Item'}">
        Add Item
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #101010,
                #202020
            );
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-box {
            background: #181818;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #252525;
            color: white;
            font-size: 16px;
        }

        button,
        .back-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #1976d2;
        }

        button:hover {
            background: #125ca1;
        }

        .back-btn {
            background: #444;
        }

        .back-btn:hover {
            background: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <h1
        th:text="${cash.id == null
            ? 'Add Item'
            : 'Edit Item'}">

        Add Item

    </h1>

    <div class="form-box">

        <form
            action="/cash"
            method="post">

            <input
                type="hidden"
                name="id"
                th:value="${cash.id}">

            <label>
                Code
            </label>

            <input
                type="text"
                name="code"
                th:value="${cash.code}"
                maxlength="4"
                placeholder="Example: 0203"
                required>

            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                th:value="${cash.name}"
                placeholder="Example: Chocolate Bar">

            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                th:value="${cash.price}"
                min="0"
                step="0.01"
                placeholder="Example: 25.00"
                required>

            <button
                type="submit"
                th:text="${cash.id == null
                    ? 'Add Item'
                    : 'Save Changes'}">

                Add Item

            </button>

        </form>

        <a
            href="/cash"
            class="back-btn">

            Back to Cash List

        </a>

    </div>

</div>

</body>

</html>
